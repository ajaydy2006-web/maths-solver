<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF922E" />
      <stop offset="100%" stop-color="#FFC928" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#FF922E" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#F4F0E5" />
  <rect x="76" y="76" width="360" height="360" rx="90" fill="url(#grad)" filter="url(#shadow)" />
  <!-- Display screen -->
  <rect x="126" y="126" width="260" height="90" rx="30" fill="#FFFFFF" opacity="0.95" />
  <text x="350" y="185" font-family="'Fredoka', sans-serif" font-size="44" font-weight="bold" fill="#222222" text-anchor="end">CALC⚡</text>
  <!-- Buttons -->
  <circle cx="166" cy="270" r="28" fill="#FFFFFF" opacity="0.9" />
  <text x="166" y="279" font-family="sans-serif" font-size="28" font-weight="bold" fill="#222222" text-anchor="middle">+</text>
  <circle cx="256" cy="270" r="28" fill="#FFFFFF" opacity="0.9" />
  <text x="256" y="279" font-family="sans-serif" font-size="28" font-weight="bold" fill="#222222" text-anchor="middle">−</text>
  <circle cx="346" cy="270" r="28" fill="#FFFFFF" opacity="0.9" />
  <text x="346" y="279" font-family="sans-serif" font-size="28" font-weight="bold" fill="#222222" text-anchor="middle">×</text>
  <circle cx="166" cy="350" r="28" fill="#FFFFFF" opacity="0.9" />
  <text x="166" y="359" font-family="sans-serif" font-size="28" font-weight="bold" fill="#222222" text-anchor="middle">÷</text>
  <rect x="226" y="322" width="150" height="56" rx="28" fill="#222222" />
  <text x="301" y="359" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">=</text>
</svg>
